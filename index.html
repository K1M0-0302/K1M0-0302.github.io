<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K!M0&#x27;s Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Gowun+Dodum&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #a6d3e9;
  --bg-grad: linear-gradient(180deg, #b7dcee 0%, #a6d3e9 42%, #8fc6e1 78%, #7ab9da 100%);
  --nav-bg: rgba(183, 220, 238, .9);
  /* 카드는 「반투명 흰 베일」이다 — 배경 위에 늘 같은 비율로 얹히므로, 카드가 화면을 덮는
     상세 페이지와 배경이 많이 보이는 목록 페이지의 밝기가 구조적으로 같아진다. */
  --surface: rgba(255, 255, 255, .52); --border: #7fb6d2;
  --text: #0c2836; --muted: #3d6072; --accent: #006080;
  /* 배경 위에 직접 놓이는 작은 액센트 글자용 — 카드 없이도 대비 4.5:1 을 넘긴다 */
  --accent-strong: #004a62;
  --accent-soft: rgba(0, 96, 128, .15); --code-bg: rgba(255, 255, 255, .38);
  --splash: #2e83a6;  /* 배경 물빛을 한 단계 내린 전환용 바다색 */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #041521;
    --bg-grad: linear-gradient(180deg, #041521 0%, #0a2233 45%, #0d2d42 100%);
    --nav-bg: rgba(4, 21, 33, .88);
    --surface: rgba(255, 255, 255, .07); --border: #2a5a75;
    --text: #e3f0f7; --muted: #97b9c9; --accent: #43bcdd;
    --accent-strong: #7fd8f2;
    --accent-soft: rgba(67, 188, 221, .18); --code-bg: rgba(255, 255, 255, .06);
    --splash: #0a2536;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg) var(--bg-grad) no-repeat fixed;
  color: var(--text);
  font-family: "Nunito", "Gowun Dodum", -apple-system, "Segoe UI",
    "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  line-height: 1.8; letter-spacing: .005em;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
/* 제목류는 손글씨풍 개구 — 획이 가늘어 한 급 크게 잡는다 */
.brand, .hero h1, .hero .tagline, .section-label, .row-title, .article-title,
.body h2, .body h3 {
  font-family: "Gaegu", "Nunito", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
.nav {
  position: sticky; top: 0; z-index: 10;
  background: var(--nav-bg);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 760px; margin: 0 auto; padding: 14px 24px;
  display: flex; justify-content: space-between; align-items: center;
}
.brand { font-weight: 700; font-size: 1.15rem; letter-spacing: 0; }
.links { display: flex; gap: 18px; }
.links a { color: var(--muted); font-size: .95rem; font-weight: 600; }
.links a:hover { color: var(--accent); }
.hero { max-width: 760px; margin: 0 auto; padding: 80px 24px 32px; }
.eyebrow {
  margin: 0 0 10px; color: var(--accent-strong); font-size: .8rem;
  font-weight: 700; letter-spacing: .18em;
}
.hero h1 {
  margin: 0; font-size: clamp(2.7rem, 7.5vw, 4.2rem);
  font-weight: 700; letter-spacing: 0;
}
.hero .tagline { margin: 10px 0 0; font-size: 1.6rem; color: var(--muted); }
/* 히어로 아래 바다 띠: 파도 + 그 위에 뜬 종이배 */
.seascape { position: relative; padding-top: 40px; margin: -8px 0 4px; }
.wave {
  position: relative; z-index: 1; height: 44px; overflow: hidden;
  color: var(--accent-soft);
}
.boat {
  position: absolute; z-index: 0; bottom: 14px; left: 14%;
  width: 62px; height: 46px;
  animation: drift 19s ease-in-out infinite alternate;
}
.boat-bob {
  width: 100%; height: 100%;
  filter: drop-shadow(0 3px 5px rgba(6, 60, 88, .28));
  animation: bob 4.2s ease-in-out infinite;
}
@keyframes drift { from { transform: translateX(-26px); } to { transform: translateX(34px); } }
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-3.5deg); }
  50%      { transform: translateY(-5px) rotate(3.5deg); }
}
@media (prefers-reduced-motion: reduce) {
  .boat, .boat-bob { animation: none; }
}
.wave svg {
  position: absolute; bottom: 0; left: 0;
  width: 200%; height: 44px; display: block;
}
.wave .w1 { animation: drift 11s linear infinite; }
.wave .w2 { animation: drift 7s linear infinite reverse; opacity: .55; }
@keyframes drift { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .wave svg { animation: none; } }
.group { display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 72px; }
.group + .group { margin-top: 24px; }
.section-label {
  margin: 0 0 4px; font-weight: 700; font-size: 1.35rem; letter-spacing: 0;
}
.section-label span { color: var(--muted); font-weight: 500; font-size: .9rem; margin-left: 6px; }
.feed {
  max-width: 760px; margin: 0 auto; padding: 8px 24px 64px;
  display: flex; flex-direction: column; gap: 20px;
}
.row {
  display: flex; gap: 14px; align-items: center;
  padding: 14px 18px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; backdrop-filter: blur(6px);
  box-shadow: 0 3px 12px rgba(10, 90, 125, .07);
  transition: box-shadow .2s ease, transform .2s ease;
}
.row:hover { box-shadow: 0 10px 26px rgba(10, 90, 125, .13); transform: translateY(-1px); }
.row::after {
  content: "→"; margin-left: auto; color: var(--muted);
  font-size: 1.05rem; font-weight: 700;
}
.row:hover::after { color: var(--accent); }
.tile {
  flex: 0 0 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.dolphin {
  display: block; width: 68%; height: 68%; background: #fff;
  -webkit-mask: url(dolphin.png) center/contain no-repeat;
  mask: url(dolphin.png) center/contain no-repeat;
}
.row-body { min-width: 0; }
.row-title { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: 0; }
.more { color: var(--accent-strong); font-weight: 700; font-size: .9rem; }
.overflow > summary {
  cursor: pointer; list-style: none; text-align: center;
  color: var(--accent); font-weight: 700; font-size: .9rem;
  padding: 10px; border: 1px dashed var(--border); border-radius: 12px;
}
.overflow > summary::-webkit-details-marker { display: none; }
.overflow[open] > summary { margin-bottom: 12px; }
.overflow[open] > .row + .row { margin-top: 12px; }
.article { max-width: 760px; margin: 0 auto; padding: 56px 24px 64px; }
.article-title {
  margin: 6px 0 20px; font-size: clamp(2.1rem, 6vw, 3rem);
  font-weight: 700; letter-spacing: 0;
}
.back { display: inline-block; margin-top: 32px; }
/* 박스 사이를 목록 카드 간격(12px)보다 넉넉히 벌려 배경 물빛이 그만큼 드러나게 한다 */
.body { display: flex; flex-direction: column; gap: 20px; }
.box {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 14px; padding: 18px 22px; backdrop-filter: blur(6px);
  box-shadow: 0 4px 16px rgba(10, 90, 125, .09);
  transition: box-shadow .2s ease, transform .2s ease;
}
.box:hover { box-shadow: 0 10px 26px rgba(10, 90, 125, .13); transform: translateY(-1px); }
.body h2 {
  margin: 0 0 8px; font-size: 1.35rem; font-weight: 700;
  color: var(--accent); letter-spacing: .01em;
}
.body h3 { margin: 20px 0 6px; font-size: 1.15rem; font-weight: 700; }
.body p { margin: 8px 0; }
.body ul { margin: 8px 0; padding-left: 22px; }
.body li { margin: 6px 0; }
.body code {
  background: var(--code-bg); padding: 2px 6px; border-radius: 6px;
  font-size: .88em; font-family: ui-monospace, Consolas, monospace;
}
.empty { text-align: center; color: var(--muted); padding: 48px 0; }
.foot {
  max-width: 760px; margin: 0 auto; padding: 0 24px 48px;
  color: var(--muted); font-size: .85rem; text-align: center;
}
/* 카드 클릭 순간: 카드에서 물결이 번진다 */
.row.splashing {
  transform: scale(.985);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 10px 28px rgba(10, 90, 125, .16);
}
.row.splashing::before {
  content: ""; position: absolute; inset: 0; border-radius: 12px;
  border: 2px solid var(--accent); opacity: .8;
  animation: ripple .6s ease-out forwards;
}
.row { position: relative; }
@keyframes ripple {
  to { transform: scale(1.06); opacity: 0; }
}

/* 화면을 통과하는 물덩이 — 이동은 transform 하나로만(레이아웃 없음) 해서 매끄럽다 */
.splash {
  position: fixed; inset: 0; z-index: 50; pointer-events: none;
  visibility: hidden; overflow: hidden; color: var(--splash);
}
.splash.active, :root[data-wave] .splash { visibility: visible; }
.splash-water {
  position: absolute; left: 0; width: 100%; height: 100%;
  background: var(--splash); transform: translateY(100%);
  will-change: transform;
}
:root[data-wave] .splash-water { transform: translateY(0); }  /* 도착 시 이미 덮인 상태 */
.crest { position: absolute; left: 0; width: 100%; height: 46px; display: block; }
.crest-top { top: -45px; }
.crest-bottom { bottom: -45px; transform: scaleY(-1); }

/* 떠날 때: 물이 들어와 화면을 덮는다 */
.splash.cover-up .splash-water { animation: to-cover .52s cubic-bezier(.45, .05, .55, 1) forwards; }
.splash.cover-down .splash-water {
  animation: to-cover .52s cubic-bezier(.45, .05, .55, 1) forwards; --from: -100%;
}
@keyframes to-cover { from { transform: translateY(var(--from, 100%)); } to { transform: translateY(0); } }

/* 도착할 때: 같은 방향으로 계속 흘러 화면을 빠져나간다 */
.splash.exit-up .splash-water { animation: from-cover .6s cubic-bezier(.32, 0, .3, 1) forwards; --to: -100%; }
.splash.exit-down .splash-water { animation: from-cover .6s cubic-bezier(.32, 0, .3, 1) forwards; }
@keyframes from-cover { from { transform: translateY(0); } to { transform: translateY(var(--to, 100%)); } }

/* 물 없이 바로 열었을 때만 본문이 떠오른다 (전환으로 왔으면 물이 걷히며 이미 드러난다) */
:root:not([data-wave]) .arrive { animation: surface .5s cubic-bezier(.2, .7, .3, 1) both; }
@keyframes surface {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .splash { display: none; }
  .row.splashing::before { animation: none; }
  :root:not([data-wave]) .arrive { animation: none; }
}
@media (max-width: 560px) {
  .row-detail { padding-left: 18px; }
  .hero { padding-top: 56px; }
}

</style>

<script>
(function () {
  var root = document.documentElement;
  var splash = document.querySelector('.splash');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!splash) return;

  // 도착: 덮고 있던 물이 오던 방향 그대로 계속 흘러 화면을 빠져나간다
  var arrived = root.getAttribute('data-wave');
  if (arrived && !reduce) {
    splash.classList.add('active', 'exit-' + arrived);
    setTimeout(function () {
      splash.className = 'splash';
      root.removeAttribute('data-wave');
    }, 700);
  }

  function leave(link, dir, before) {
    link.addEventListener('click', function (ev) {
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
      var href = link.getAttribute('href');
      if (!href || reduce) return;
      ev.preventDefault();
      if (before) before();
      try { sessionStorage.setItem('wave-dir', dir); } catch (e) {}
      splash.className = 'splash active cover-' + dir;
      setTimeout(function () { location.href = href; }, 500);
    });
  }
  // 목록 → 상세: 물이 아래에서 차오른다. 상세 → 목록: 위에서 쓸려 내려온다.
  document.querySelectorAll('a.row').forEach(function (card) {
    leave(card, 'up', function () { card.classList.add('splashing'); });
  });
  document.querySelectorAll('a[href="index.html"]').forEach(function (link) {
    leave(link, 'down', null);
  });

  // 뒤로가기(bfcache)로 돌아오면 덮여 있던 물을 걷어낸다
  window.addEventListener('pageshow', function (ev) {
    if (ev.persisted) { splash.className = 'splash'; root.removeAttribute('data-wave'); }
  });
})();

</script>
